<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Products Active | exclusive Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 1.5rem;
            text-align: center;
        }
        .card {
            background-color: #121826;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 3rem;
            border-radius: 20px;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: #fff;
        }
        p {
            color: #9ca3af;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #8b5cf6;
            color: white;
            text-decoration: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #7c3aed;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>No Active Products</h1>
        <p>There are currently no active products in the store. Please log in to the Django Admin and add a new product or mark existing ones as active.</p>
        <a href="/admin/" class="btn">Go to Django Admin</a>
    </div>
</body>
</html>
